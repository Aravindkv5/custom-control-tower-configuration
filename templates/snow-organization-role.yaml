AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Creates SnowOrganizationAccountAccessRole with inline policy
  SnowOrganizationAccountAccessPolicy for ServiceNow integration.
  Deployed via CfCT StackSet to all member accounts.

Resources:
  SnowOrganizationAccountAccessRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: SnowOrganizationAccountAccessRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: "arn:aws:iam::533267399658:user/ServiceNow"
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: SnowOrganizationAccountAccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ServiceNowUserReadOnlyAccessOrg
                Effect: Allow
                Action:
                  - organizations:DescribeOrganization
                  - organizations:ListAccounts
                  - organizations:ListRoots
                  - organizations:ListAccountsForParent
                  - organizations:ListOrganizationalUnitsForParent
                  - organizations:DescribeOrganizationalUnit
                  - organizations:ListTagsForResource
                Resource: "*"

              - Sid: ServiceNowUserReadOnlyAccessConfig
                Effect: Allow
                Action:
                  - config:ListDiscoveredResources
                  - config:SelectResourceConfig
                  - config:BatchGetResourceConfig
                Resource: "*"

              - Sid: ServiceNowUserReadOnlyAccessConfigAgg
                Effect: Allow
                Action:
                  - config:DescribeConfigurationAggregators
                  - config:SelectAggregateResourceConfig
                  - config:BatchGetAggregateResourceConfig
                Resource: "*"

              - Sid: ServiceNowUserReadOnlyAccessEC2
                Effect: Allow
                Action:
                  - ec2:DescribeRegions
                  - ec2:DescribeImages
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceTypes
                Resource: "*"

              - Sid: ServiceNowUserReadOnlyAccessSSM
                Effect: Allow
                Action:
                  - ssm:DescribeInstanceInformation
                  - ssm:ListInventoryEntries
                  - ssm:GetInventory
                Resource: "*"

              - Sid: ServiceNowUserReadOnlyAccessTag
                Effect: Allow
                Action:
                  - tag:GetResources
                Resource: "*"

              - Sid: ServiceNowUserReadOnlyAccessIAM
                Effect: Allow
                Action:
                  - iam:CreateAccessKey
                  - iam:DeleteAccessKey
                Resource:
                  - "arn:aws:iam::533267399658:user/ServiceNow"

              - Sid: ServiceNowSendCommandAccess
                Effect: Allow
                Action:
                  - ssm:SendCommand
                Resource:
                  - "arn:aws:ec2:*:533267404507:instance/*"
                  - "arn:aws:ssm:*:533267404507:document/SG-AWS*"

              - Sid: ServiceNowS3BucketAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - "arn:aws:s3:::aecom-servicenow-graphconnector-gf/*"
                  - "arn:aws:s3:::aecom-servicenow-graphconnector-gf"

Outputs:
  RoleName:
    Description: Name of the created IAM role
    Value: !Ref SnowOrganizationAccountAccessRole
  RoleArn:
    Description: ARN of the created IAM role
    Value: !GetAtt SnowOrganizationAccountAccessRole.Arn