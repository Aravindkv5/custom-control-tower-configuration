AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Creates Qualys_Connector_role with AmazonEC2ReadOnlyAccess and SecurityAudit
  AWS managed policies for Qualys cloud connector integration.
  Deployed via CfCT StackSet to all member accounts.

Resources:
  QualysConnectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: Qualys_Connector_role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: "arn:aws:iam::805950163170:root"
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                sts:ExternalId: "aws-aecom"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess
        - arn:aws:iam::aws:policy/SecurityAudit

Outputs:
  RoleName:
    Description: Name of the created IAM role
    Value: !Ref QualysConnectorRole
  RoleArn:
    Description: ARN of the created IAM role
    Value: !GetAtt QualysConnectorRole.Arn